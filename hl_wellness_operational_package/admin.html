<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders Admin | HL Wellness & Beauty</title>

<style>
:root {
  --bg: #fff8f3;
  --card: #ffffff;
  --text: #2b1b18;
  --muted: #7a625c;
  --accent: #7b2f3a;
  --accent-dark: #5d202a;
  --soft: #f3ded7;
  --border: #ead2cb;
  --cream: #fff3ed;
  --success: #2f7b57;
  --warning: #a86a00;
  --shadow: 0 18px 45px rgba(84,37,43,.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 32px 18px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

h1 {
  margin: 0;
  color: var(--accent-dark);
  font-size: clamp(2rem, 4vw, 3.2rem);
}

h2, h3 {
  color: var(--accent-dark);
}

a {
  color: var(--accent);
  font-weight: 800;
  text-decoration: none;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.login-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

input, button {
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid var(--border);
  font: inherit;
}

input {
  background: #fffdfb;
  min-width: 240px;
}

button {
  background: var(--accent);
  color: white;
  font-weight: 800;
  cursor: pointer;
  border: none;
}

button.secondary {
  background: white;
  color: var(--accent);
  border: 1px solid var(--border);
}

.muted {
  color: var(--muted);
}

.success {
  color: var(--success);
  font-weight: 800;
}

.warning {
  color: var(--warning);
  font-weight: 800;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 8px 22px rgba(84,37,43,.07);
}

.stat strong {
  display: block;
  font-size: 1.8rem;
  color: var(--accent);
}

.tools {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.tools input {
  flex: 1;
  min-width: 260px;
}

.order-card {
  overflow: hidden;
}

.order-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}

.order-ref {
  font-size: 1.45rem;
  font-weight: 900;
  color: var(--accent-dark);
}

.order-total-box {
  text-align: right;
  min-width: 180px;
}

.order-total-box span {
  display: block;
  color: var(--muted);
  font-size: 0.9rem;
}

.order-total-box strong {
  display: block;
  color: var(--accent);
  font-size: 1.8rem;
}

.badge {
  display: inline-block;
  background: var(--soft);
  color: var(--accent-dark);
  padding: 6px 11px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 12px;
}

.badge.quote {
  background: #fff1cf;
  color: var(--warning);
}

.order-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.info-box {
  background: #fffdfb;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
}

.info-box h3 {
  margin-top: 0;
}

.info-line {
  display: grid;
  grid-template-columns: 125px 1fr;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
}

.info-line:last-child {
  border-bottom: none;
}

.info-line strong {
  color: var(--accent-dark);
}

.item-list {
  list-style: none;
  padding: 0;
  margin: 8px 0 0;
}

.item-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.item-list li:last-child {
  border-bottom: none;
}

.item-name {
  font-weight: 800;
}

.item-sub {
  color: var(--muted);
  font-size: 0.9rem;
}

.total {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--accent);
}

.notes-box {
  margin-top: 18px;
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
}

.notes-box h3 {
  margin-top: 0;
}

.empty {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-card {
  background: white;
  padding: 24px;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.modal-card input {
  width: 100%;
  margin-bottom: 12px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

@media (max-width: 850px) {
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .order-grid {
    grid-template-columns: 1fr;
  }

  .order-total-box {
    text-align: left;
  }
}

@media (max-width: 520px) {
  .stats {
    grid-template-columns: 1fr;
  }

  input, button {
    width: 100%;
  }

  .info-line {
    grid-template-columns: 1fr;
    gap: 2px;
  }
}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Orders Admin</h1>
      <p class="muted">Private order viewer for HL Wellness & Beauty.</p>
      <p class="muted" id="loggedInAs"></p>
    </div>
    <a href="./index.html">← Back to shop</a>
  </header>

  <div class="card">
    <h2>Login</h2>
    <p class="muted">Enter your admin PIN to load orders.</p>

    <div class="login-row">
      <input id="pin" type="password" placeholder="Admin PIN" />
      <button onclick="loadOrders()">Load Orders</button>
    </div>

    <p class="muted" id="status"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="stats">
      <div class="stat">
        <span class="muted">Total Orders</span>
        <strong id="statOrders">0</strong>
      </div>
      <div class="stat">
        <span class="muted">Fixed Sales</span>
        <strong id="statSales">€0.00</strong>
      </div>
      <div class="stat">
        <span class="muted">Quote Orders</span>
        <strong id="statQuotes">0</strong>
      </div>
      <div class="stat">
        <span class="muted">Latest Order</span>
        <strong id="statLatest">-</strong>
      </div>
    </div>

    <div style="margin-bottom:18px;">
      <button id="changePasswordBtn" onclick="openPasswordModal()">Change Password</button>
      <p class="muted" id="passwordHint"></p>
    </div>

    <div class="tools">
      <input id="search" placeholder="Search by name, phone, email, order ref, rep..." oninput="renderOrders()" />
      <button class="secondary" onclick="loadOrders()">Refresh</button>
    </div>
  </div>

  <div id="orders"></div>
</div>

<div id="passwordModal" class="modal">
  <div class="modal-card">
    <h2>Change Password</h2>
    <p class="muted">Only rep accounts can change their own password. Master admin cannot change passwords here.</p>

    <input id="newPassword" type="password" placeholder="New PIN" />

    <div class="modal-actions">
      <button onclick="changePassword()">Save</button>
      <button class="secondary" onclick="closePasswordModal()">Cancel</button>
    </div>

    <p id="passwordStatus" class="muted"></p>
  </div>
</div>

<script>
let allOrders = [];
let currentPin = "";
let currentMode = "";
let currentRepCode = "";

async function loadOrders() {
  const pin = document.getElementById("pin").value.trim();
  const status = document.getElementById("status");
  const ordersEl = document.getElementById("orders");
  const dashboard = document.getElementById("dashboard");
  const loggedInEl = document.getElementById("loggedInAs");
  const changePasswordBtn = document.getElementById("changePasswordBtn");
  const passwordHint = document.getElementById("passwordHint");

  status.textContent = "Loading orders...";
  ordersEl.innerHTML = "";
  dashboard.style.display = "none";
  loggedInEl.textContent = "";

  try {
    const res = await fetch("/api/orders?pin=" + encodeURIComponent(pin));
    const data = await res.json();

    if (!res.ok) {
      status.textContent = data.error || "Failed to load orders.";
      return;
    }

    currentPin = pin;
    currentMode = data.mode || "";
    currentRepCode = data.repCode || "";

    allOrders = data.orders || [];
    status.textContent = `Loaded ${allOrders.length} order(s).`;

    const names = {
      "1847": "Darren",
      "3729": "Yanice",
      "6408": "Joshua",
      "9152": "Upline"
    };

    if (currentMode === "master") {
      loggedInEl.textContent = "Logged in as: MASTER ADMIN";
      changePasswordBtn.style.display = "none";
      passwordHint.textContent = "Master admin can view all orders. Password change is available only for rep accounts.";
    } else {
      loggedInEl.textContent = "Logged in as: " + (names[currentRepCode] || currentRepCode);
      changePasswordBtn.style.display = "inline-block";
      passwordHint.textContent = "You can change only your own admin PIN.";
    }

    updateStats();
    dashboard.style.display = "block";
    renderOrders();

  } catch (e) {
    status.textContent = "Could not connect to backend.";
  }
}

function updateStats() {
  const totalOrders = allOrders.length;

  const fixedSales = allOrders.reduce((sum, order) => {
    return sum + Number(order.totals?.fixedTotal || 0);
  }, 0);

  const quoteOrders = allOrders.filter(order => order.totals?.hasQuoteRequiredItems).length;

  const latest = allOrders[0]?.createdAt
    ? new Date(allOrders[0].createdAt).toLocaleDateString()
    : "-";

  document.getElementById("statOrders").textContent = totalOrders;
  document.getElementById("statSales").textContent = "€" + fixedSales.toFixed(2);
  document.getElementById("statQuotes").textContent = quoteOrders;
  document.getElementById("statLatest").textContent = latest;
}

function renderOrders() {
  const ordersEl = document.getElementById("orders");
  const query = document.getElementById("search")?.value.toLowerCase().trim() || "";

  const filtered = allOrders.filter(order => {
    const blob = [
      order.orderRef,
      order.status,
      order.rep?.name,
      order.rep?.repCode,
      order.customer?.name,
      order.customer?.phone,
      order.customer?.email,
      order.customer?.fulfillment,
      order.customer?.paymentMethod,
      order.customer?.address,
      order.customer?.notes
    ].join(" ").toLowerCase();

    return blob.includes(query);
  });

  if (filtered.length === 0) {
    ordersEl.innerHTML = `<div class="card empty">No orders found.</div>`;
    return;
  }

  ordersEl.innerHTML = filtered.map(order => {
    const created = order.createdAt
      ? new Date(order.createdAt).toLocaleString()
      : "Unknown date";

    const fixedTotal = Number(order.totals?.fixedTotal || 0).toFixed(2);
    const hasQuote = order.totals?.hasQuoteRequiredItems;

    const items = (order.items || []).map(item => {
      const price = item.quoteRequired
        ? `<span class="badge quote">Quote Required</span>`
        : `€${Number(item.price || 0).toFixed(2)}`;

      const lineTotal = item.quoteRequired
        ? "Quote Required"
        : `€${(Number(item.price || 0) * Number(item.quantity || 1)).toFixed(2)}`;

      return `
        <li>
          <div>
            <div class="item-name">${escapeHtml(item.name || "Item")}</div>
            <div class="item-sub">Quantity: ${item.quantity || 1} · Unit: ${price}</div>
          </div>
          <strong>${lineTotal}</strong>
        </li>
      `;
    }).join("");

    return `
      <div class="card order-card">
        <div class="order-head">
          <div>
            <div class="order-ref">${escapeHtml(order.orderRef || "No Ref")}</div>
            <div class="muted">${created}</div>
            <div style="margin-top:8px;">
              <span class="badge">${escapeHtml(order.status || "New")}</span>
              ${hasQuote ? `<span class="badge quote">Contains Quote Item</span>` : ""}
            </div>
          </div>

          <div class="order-total-box">
            <span>Fixed total</span>
            <strong>€${fixedTotal}</strong>
            ${hasQuote ? `<span class="muted">+ quote required</span>` : ""}
          </div>
        </div>

        <div class="order-grid">
          <div class="info-box">
            <h3>Customer Details</h3>
            ${infoLine("Name", order.customer?.name)}
            ${infoLine("Phone", order.customer?.phone)}
            ${infoLine("Email", order.customer?.email)}
            ${infoLine("Fulfilment", order.customer?.fulfillment)}
            ${infoLine("Payment", order.customer?.paymentMethod)}
            ${infoLine("Address", order.customer?.address)}
          </div>

          <div class="info-box">
            <h3>Assigned Rep & Items</h3>
            ${infoLine("Rep", `${order.rep?.name || "-"} (${order.rep?.repCode || "-"})`)}

            <ul class="item-list">
              ${items || "<li>No items</li>"}
            </ul>

            <div class="total">
              Total: €${fixedTotal}
              ${hasQuote ? "+ Quote Required Items" : ""}
            </div>
          </div>
        </div>

        ${order.customer?.notes ? `
          <div class="notes-box">
            <h3>Customer Notes</h3>
            <p>${escapeHtml(order.customer.notes)}</p>
          </div>
        ` : ""}
      </div>
    `;
  }).join("");
}

function openPasswordModal() {
  if (currentMode === "master") {
    alert("Master admin cannot change rep passwords here.");
    return;
  }

  document.getElementById("passwordModal").style.display = "flex";
}

function closePasswordModal() {
  document.getElementById("passwordModal").style.display = "none";
  document.getElementById("passwordStatus").textContent = "";
  document.getElementById("newPassword").value = "";
}

async function changePassword() {
  const newPin = document.getElementById("newPassword").value.trim();
  const status = document.getElementById("passwordStatus");

  status.textContent = "Saving...";

  try {
    const res = await fetch("/api/change-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        currentPin,
        newPin
      })
    });

    const data = await res.json();

    if (!res.ok) {
      status.textContent = data.error || "Failed.";
      return;
    }

    currentPin = newPin;
    document.getElementById("pin").value = newPin;
    status.textContent = "Password changed successfully.";
    status.className = "success";

  } catch {
    status.textContent = "Connection failed.";
  }
}

function infoLine(label, value) {
  return `
    <div class="info-line">
      <strong>${escapeHtml(label)}:</strong>
      <span>${escapeHtml(value || "-")}</span>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>
</body>
</html>
