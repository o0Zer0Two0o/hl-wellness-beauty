<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders Admin | HL Wellness & Beauty</title>

<style>
:root {
  --bg: #fff8f3;
  --card: #ffffff;
  --text: #2b1b18;
  --muted: #7a625c;
  --accent: #7b2f3a;
  --accent-dark: #5d202a;
  --soft: #f3ded7;
  --border: #ead2cb;
  --cream: #fff3ed;
  --success: #2f7b57;
  --warning: #a86a00;
  --shadow: 0 18px 45px rgba(84,37,43,.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 32px 18px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

h1 {
  margin: 0;
  color: var(--accent-dark);
  font-size: clamp(2rem, 4vw, 3.2rem);
}

h2, h3 {
  color: var(--accent-dark);
}

a {
  color: var(--accent);
  font-weight: 800;
  text-decoration: none;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.login-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

input, button {
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid var(--border);
  font: inherit;
}

input {
  background: #fffdfb;
  min-width: 240px;
}

button {
  background: var(--accent);
  color: white;
  font-weight: 800;
  cursor: pointer;
  border: none;
}

button.secondary {
  background: white;
  color: var(--accent);
  border: 1px solid var(--border);
}

.muted {
  color: var(--muted);
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 8px 22px rgba(84,37,43,.07);
}

.stat strong {
  display: block;
  font-size: 1.8rem;
  color: var(--accent);
}

.tools {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.tools input {
  flex: 1;
  min-width: 260px;
}

.order-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
  margin-bottom: 16px;
}

.order-ref {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--accent-dark);
}

.badge {
  display: inline-block;
  background: var(--soft);
  color: var(--accent-dark);
  padding: 6px 11px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 12px;
}

.badge.quote {
  background: #fff1cf;
  color: var(--warning);
}

.order-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.info-box {
  background: #fffdfb;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
}

.info-box p {
  margin: 7px 0;
}

.item-list {
  list-style: none;
  padding: 0;
  margin: 8px 0 0;
}

.item-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.item-list li:last-child {
  border-bottom: none;
}

.total {
  margin-top: 14px;
  font-size: 1.25rem;
  font-weight: 900;
  color: var(--accent);
}

.raw {
  display: none;
  white-space: pre-wrap;
  background: #fffdfb;
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 14px;
  overflow: auto;
  margin-top: 12px;
  font-size: 0.9rem;
}

.empty {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}

@media (max-width: 850px) {
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .order-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 520px) {
  .stats {
    grid-template-columns: 1fr;
  }

  input, button {
    width: 100%;
  }
}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Orders Admin</h1>
      <p class="muted">Private order viewer for HL Wellness & Beauty.</p>
    </div>
    <a href="./index.html">← Back to shop</a>
  </header>

  <div class="card">
    <h2>Login</h2>
    <p class="muted">Enter your admin PIN to load orders.</p>

    <div class="login-row">
      <input id="pin" type="password" placeholder="Admin PIN" />
      <button onclick="loadOrders()">Load Orders</button>
    </div>

    <p class="muted" id="status"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="stats">
      <div class="stat">
        <span class="muted">Total Orders</span>
        <strong id="statOrders">0</strong>
      </div>
      <div class="stat">
        <span class="muted">Fixed Sales</span>
        <strong id="statSales">€0.00</strong>
      </div>
      <div class="stat">
        <span class="muted">Quote Orders</span>
        <strong id="statQuotes">0</strong>
      </div>
      <div class="stat">
        <span class="muted">Latest Order</span>
        <strong id="statLatest">-</strong>
      </div>
    </div>

    <div class="tools">
      <input id="search" placeholder="Search by name, phone, email, order ref, rep..." oninput="renderOrders()" />
      <button class="secondary" onclick="loadOrders()">Refresh</button>
    </div>
  </div>

  <div id="orders"></div>
</div>

<script>
let allOrders = [];

async function loadOrders() {
  const pin = document.getElementById("pin").value.trim();
  const status = document.getElementById("status");
  const ordersEl = document.getElementById("orders");
  const dashboard = document.getElementById("dashboard");

  status.textContent = "Loading orders...";
  ordersEl.innerHTML = "";
  dashboard.style.display = "none";

  try {
    const res = await fetch("/api/orders?pin=" + encodeURIComponent(pin));
    const data = await res.json();

    if (!res.ok) {
      status.textContent = data.error || "Failed to load orders.";
      return;
    }

    allOrders = data.orders || [];
    status.textContent = `Loaded ${allOrders.length} order(s).`;

    updateStats();
    dashboard.style.display = "block";
    renderOrders();

  } catch (e) {
    status.textContent = "Could not connect to backend.";
  }
}

function updateStats() {
  const totalOrders = allOrders.length;

  const fixedSales = allOrders.reduce((sum, order) => {
    return sum + Number(order.totals?.fixedTotal || 0);
  }, 0);

  const quoteOrders = allOrders.filter(order => order.totals?.hasQuoteRequiredItems).length;

  const latest = allOrders[0]?.createdAt
    ? new Date(allOrders[0].createdAt).toLocaleDateString()
    : "-";

  document.getElementById("statOrders").textContent = totalOrders;
  document.getElementById("statSales").textContent = "€" + fixedSales.toFixed(2);
  document.getElementById("statQuotes").textContent = quoteOrders;
  document.getElementById("statLatest").textContent = latest;
}

function renderOrders() {
  const ordersEl = document.getElementById("orders");
  const query = document.getElementById("search")?.value.toLowerCase().trim() || "";

  const filtered = allOrders.filter(order => {
    const blob = [
      order.orderRef,
      order.status,
      order.rep?.name,
      order.rep?.repCode,
      order.customer?.name,
      order.customer?.phone,
      order.customer?.email,
      order.customer?.fulfillment,
      order.customer?.paymentMethod,
      order.customer?.address,
      order.customer?.notes
    ].join(" ").toLowerCase();

    return blob.includes(query);
  });

  if (filtered.length === 0) {
    ordersEl.innerHTML = `<div class="card empty">No orders found.</div>`;
    return;
  }

  ordersEl.innerHTML = filtered.map((order, index) => {
    const created = order.createdAt
      ? new Date(order.createdAt).toLocaleString()
      : "Unknown date";

    const items = (order.items || []).map(item => {
      const price = item.quoteRequired
        ? `<span class="badge quote">Quote Required</span>`
        : `€${Number(item.price || 0).toFixed(2)}`;

      return `
        <li>
          <span>${escapeHtml(item.name || "Item")} x${item.quantity || 1}</span>
          <strong>${price}</strong>
        </li>
      `;
    }).join("");

    return `
      <div class="card">
        <div class="order-head">
          <div>
            <div class="order-ref">${escapeHtml(order.orderRef || "No Ref")}</div>
            <div class="muted">${created}</div>
          </div>
          <div>
            <span class="badge">${escapeHtml(order.status || "New")}</span>
          </div>
        </div>

        <div class="order-grid">
          <div class="info-box">
            <h3>Customer</h3>
            <p><strong>Name:</strong> ${escapeHtml(order.customer?.name || "-")}</p>
            <p><strong>Phone:</strong> ${escapeHtml(order.customer?.phone || "-")}</p>
            <p><strong>Email:</strong> ${escapeHtml(order.customer?.email || "-")}</p>
            <p><strong>Fulfilment:</strong> ${escapeHtml(order.customer?.fulfillment || "-")}</p>
            <p><strong>Payment:</strong> ${escapeHtml(order.customer?.paymentMethod || "-")}</p>
            <p><strong>Address:</strong> ${escapeHtml(order.customer?.address || "-")}</p>
            <p><strong>Notes:</strong> ${escapeHtml(order.customer?.notes || "-")}</p>
          </div>

          <div class="info-box">
            <h3>Rep & Items</h3>
            <p><strong>Rep:</strong> ${escapeHtml(order.rep?.name || "-")} (${escapeHtml(order.rep?.repCode || "-")})</p>

            <ul class="item-list">
              ${items || "<li>No items</li>"}
            </ul>

            <div class="total">
              Total: €${Number(order.totals?.fixedTotal || 0).toFixed(2)}
              ${order.totals?.hasQuoteRequiredItems ? "+ Quote Required Items" : ""}
            </div>
          </div>
        </div>

        <button class="secondary" style="margin-top:14px;" onclick="toggleRaw(${index})">Show Raw</button>
        <pre class="raw" id="raw-${index}">${escapeHtml(JSON.stringify(order, null, 2))}</pre>
      </div>
    `;
  }).join("");
}

function toggleRaw(index) {
  const raw = document.getElementById("raw-" + index);
  if (!raw) return;
  raw.style.display = raw.style.display === "block" ? "none" : "block";
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>
</body>
</html>
