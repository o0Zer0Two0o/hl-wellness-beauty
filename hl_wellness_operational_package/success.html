<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Order received</title><style>body{font-family:Arial,sans-serif;background:#fff8f3;color:#2b1b18;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;border-radius:24px;padding:32px;max-width:560px;box-shadow:0 20px 50px rgba(84,37,43,.12)}h1{margin-top:0}.ref{background:#f3ded7;padding:10px 12px;border-radius:12px;font-weight:700;word-break:break-word}a{color:#7b2f3a;font-weight:700}</style></head>
<body><div class="card"><h1>Order received ✅</h1><p>Thank you. Your order was sent successfully.</p><p>Payment will be completed manually using the method selected at checkout.</p><p class="ref" id="orderRef"></p><p>You should receive a confirmation email shortly.</p><a href="./index.html">Return to shop</a></div><script>const params=new URLSearchParams(window.location.search);const order=params.get("order");document.getElementById("orderRef").textContent=order?`Order reference: ${order}`:"";</script></body></html>
